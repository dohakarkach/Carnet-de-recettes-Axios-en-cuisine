<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de recettes</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-white shadow-sm px-6 py-4">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-green-800">
            RecipeBook
        </h1>

        <nav>
            <a href="#" class="text-gray-700 hover:text-green-700">
                Accueil
            </a>
        </nav>
    </div>
</header>
   <form id="search-form" class="flex gap-2 p-6">
    <input
        type="search"
        id="search-input"
        placeholder="Rechercher une recette..."
        class="border rounded-lg px-4 py-2 flex-1"
    >

    <button
        type="submit"
        class="bg-green-700 text-white rounded-lg px-5 py-2"
    >
        Rechercher
    </button>
</form>
    <p id="recipes-count"></p>
<main id="recipes-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
</main>
<form id="recipe-form" novalidate  class="bg-white shadow-md rounded-xl p-6 max-w-lg mx-auto space-y-4">

    <h2 class="text-2xl font-bold text-green-800">Ajouter une recette</h2>

    <div>
        <label for="recipe-name" class="block font-semibold mb-1">Nom de la recette</label>
        <input
            type="text"
            id="recipe-name"
            name="name"
            minlength="3"
            maxlength="60"
            required
            class="w-full border rounded-lg px-4 py-2"
            placeholder="Exemple : Couscous marocain"
        >
    </div>

    <div>
        <label for="recipe-cuisine" class="block font-semibold mb-1">Cuisine</label>
        <input
            type="text"
            id="recipe-cuisine"
            name="cuisine"
            required
            class="w-full border rounded-lg px-4 py-2"
            placeholder="Exemple : Moroccan"
        >
    </div>

    <div>
        <label for="recipe-difficulty" class="block font-semibold mb-1">Difficulté</label>
        <select
            id="recipe-difficulty"
            name="difficulty"
            required
            class="w-full border rounded-lg px-4 py-2"
        >
            <option value="">Choisir une difficulté</option>
            <option value="Easy">Facile</option>
            <option value="Medium">Moyenne</option>
            <option value="Hard">Difficile</option>
        </select>
    </div>

    <div>
        <label for="recipe-time" class="block font-semibold mb-1">Temps de préparation (minutes)</label>
        <input
            type="number"
            id="recipe-time"
            name="prepTimeMinutes"
            min="1"
            max="300"
            required
            class="w-full border rounded-lg px-4 py-2"
            placeholder="Exemple : 45"
        >
    </div>

    <button
    id="Ajouter"
        type="submit"
        class="w-full bg-green-700 text-white font-semibold rounded-lg py-3 hover:bg-green-800"
    >
        Ajouter la recette
    </button>
<p id="success-message" class="hidden text-green-600 font-semibold"></p>
</form>
<footer class="bg-green-900 text-white text-center p-6 mt-10">
    <p>© 2026 RecipeBook. Tous droits réservés.</p>
    <p class="text-sm text-green-200 mt-2">
        Découvrez et partagez vos recettes préférées.
    </p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
